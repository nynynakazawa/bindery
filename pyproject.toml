[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bindery-mcp"
version = "0.1.0"
description = "One shared memory for Claude Code and Codex. Markdown stays the source of truth; retrieval is budgeted."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "memory", "claude-code", "codex", "obsidian", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# Everything needed for the one supported configuration. Semantic search used
# to be an extra, which meant the documented install produced a system that
# retrieved worse than the one described in the README, and the user had to
# know that to fix it. There is one way this works, and it works after one
# command.
#
# sqlite-vec is pinned tightly on purpose: it is pre-1.0, and the index it
# builds lives in the user's database.
dependencies = [
  "mcp>=2,<3",
  "fastembed>=0.4",
  "sqlite-vec>=0.1.6,<0.2",
]

[project.optional-dependencies]
# Kept so that `pip install 'bindery-mcp[semantic]'` from older instructions
# still resolves. Semantic search is no longer optional; this is now a no-op.
semantic = []
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/nynynakazawa/bindery"
Repository = "https://github.com/nynynakazawa/bindery"
Issues = "https://github.com/nynynakazawa/bindery/issues"

[project.scripts]
bindery = "bindery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bindery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
